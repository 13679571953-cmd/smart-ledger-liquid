name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 初始化 Android 平台与依赖
        run: |
          flutter create . --project-name smart_ledger --platforms=android --org com.offline
          flutter pub get

      - name: 编译 Release APK
        run: flutter build apk --release

      - name: 上传 APK 安装包
        uses: actions/upload-artifact@v4
        with:
          name: smart-ledger-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
